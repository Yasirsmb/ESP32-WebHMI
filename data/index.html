<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 WebHMI</title>
  <style>
    :root {
      --bg:       var(--bg);
      --card-bg:  var(--card-bg);
      --border:   var(--border);
      --accent:   var(--accent);
      --label:    var(--label);
      --text-mid: var(--text-mid);
      --text:     var(--text);
      --unit:     var(--unit);
      --ok:       var(--ok);
      --warn:     var(--unit);
      --crit:     var(--crit);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', Consolas, monospace;
      background: var(--bg);
      color: var(--text-mid);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    .topbar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      height: 42px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .brand { font-size: 0.78rem; color: var(--accent); letter-spacing: 0.14em; font-weight: bold; }
    .page-title {
      position: absolute; left: 50%; transform: translateX(-50%);
      font-size: 0.82rem; color: var(--text); letter-spacing: 0.2em; text-transform: uppercase;
      pointer-events: none;
    }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .btn-edit-top {
      background: none; border: 1px solid #3a5470; border-radius: 3px;
      color: #c0d0e0; padding: 4px 11px; font-family: inherit;
      font-size: 0.68rem; letter-spacing: 0.1em; cursor: pointer;
      text-transform: uppercase; text-decoration: none;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-edit-top:hover { border-color: var(--accent); color: var(--accent); background: #0d1e38; }
    .btn-logout-top {
      background: none; border: 1px solid #3a2020; border-radius: 3px;
      color: #c07070; padding: 4px 11px; font-family: inherit;
      font-size: 0.68rem; letter-spacing: 0.1em; cursor: pointer;
      text-transform: uppercase; text-decoration: none;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-logout-top:hover { border-color: var(--crit); color: var(--crit); background: #200a0a; }
    #clock { color: var(--text); font-size: 0.82rem; letter-spacing: 0.06em; }
    .online-badge { display: flex; align-items: center; gap: 6px; color: var(--ok); font-size: 0.68rem; letter-spacing: 0.1em; }
    .dot { width: 7px; height: 7px; background: var(--ok); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }

    /* ── Widget grid ── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 10px;
      padding: 12px;
      flex: 1;
      align-content: start;
    }

    /* ── Widget card ── */
    .wcard {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 13px 15px;
      position: relative;
      overflow: hidden;
    }
    .wcard-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 8px;
    }
    .wcard-label { font-size: 0.65rem; color: var(--label); letter-spacing: 0.13em; text-transform: uppercase; }
    .wcard-unit  { font-size: 0.65rem; color: var(--unit); letter-spacing: 0.08em; text-transform: uppercase; }

    /* ── Gauge ── */
    .gauge-svg { display: block; overflow: visible; }

    /* ── Display (value + bar) ── */
    .display-big {
      font-size: 1.9rem; font-weight: bold; color: var(--accent);
      letter-spacing: 0.03em; margin: 6px 0 12px 0;
    }
    .display-bar-track { height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
    .display-bar-fill  { height: 100%; background: var(--accent); border-radius: 1px; width: 0%; transition: width 0.5s; }

    /* ── Toggle ── */
    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .toggle-state { font-size: 0.72rem; color: var(--label); letter-spacing: 0.1em; }
    .switch { position: relative; width: 44px; height: 24px; cursor: pointer; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-knob { position: absolute; inset: 0; background: #141e30; border-radius: 24px; transition: background 0.2s; }
    .slider-knob::before {
      content: ''; position: absolute; width: 18px; height: 18px;
      left: 3px; top: 3px; background: var(--label); border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    .switch input:checked + .slider-knob { background: #1a3050; }
    .switch input:checked + .slider-knob::before { transform: translateX(20px); background: var(--accent); }

    /* ── Slider ── */
    .range-input { width: 100%; accent-color: var(--accent); cursor: pointer; margin-top: 6px; }
    .slider-val  { font-size: 0.8rem; color: var(--accent); }

    /* ── Input + button ── */
    .input-group { display: flex; gap: 7px; margin-top: 6px; }
    .input-group input[type="text"] {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-radius: 3px; color: var(--text); padding: 7px 9px;
      font-size: 0.78rem; font-family: inherit; outline: none;
      transition: border-color 0.2s;
    }
    .input-group input[type="text"]:focus { border-color: var(--accent); }

    /* ── Buttons ── */
    .btn-primary {
      background: #142238; border: 1px solid #1e3354; border-radius: 3px;
      color: var(--accent); padding: 7px 13px; font-size: 0.72rem; font-family: inherit;
      font-weight: bold; cursor: pointer; letter-spacing: 0.08em;
      text-transform: uppercase; white-space: nowrap; transition: background 0.15s;
    }
    .btn-primary:hover  { background: #1a2e4a; }
    .btn-primary:active { opacity: 0.8; }
    .btn-primary.success { background: #0d2e18; border-color: var(--ok); color: var(--ok); }
    .btn-block { width: 100%; margin-top: 6px; }

    /* ── Chart ── */
    .chart-canvas { width: 100%; height: 110px; display: block; margin-top: 6px; border-radius: 3px; }

    /* ── LED indicator ── */
    .led-dot {
      width: 28px; height: 28px; border-radius: 50%;
      margin: 14px auto 6px;
      background: var(--label);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .led-dot.led-on  { background: var(--ok); box-shadow: 0 0 12px var(--ok); }

    /* ── Alarm/warn outlines ── */
    .alarm-active { outline: 1px solid var(--crit); }
    .warn-active  { outline: 1px solid var(--warn); }

    /* ── Drag and drop ── */
    .wcard[draggable="true"] { cursor: grab; }
    .wcard.dragging  { opacity: 0.25; outline: 1px dashed var(--label); }
    .wcard.drag-over { outline: 2px solid var(--accent); background: #111e35; }

    /* ── Stale badge ── */
    .stale-badge {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: #1e0505; color: var(--crit);
      font-size: 0.62rem; text-align: center; padding: 2px 4px;
      border-top: 1px solid var(--crit); letter-spacing: 0.04em;
    }

    /* ── Alarms bar ── */
    #alarms-bar {
      display: flex; align-items: center; gap: 14px;
      padding: 9px 18px; background: var(--bg);
      border-top: 1px solid var(--border); font-size: 0.7rem;
      letter-spacing: 0.1em; flex-shrink: 0;
    }
    .alarms-label { color: var(--crit); text-transform: uppercase; display: flex; align-items: center; gap: 7px; }
    .alarm-dot { font-size: 1.1rem; line-height: 1; }
    #alarms-text { color: var(--label); }

    /* ── Footer ── */
    footer {
      text-align: center; padding: 7px;
      font-size: 0.62rem; color: #222e3f; letter-spacing: 0.1em;
      border-top: 1px solid #111a28; flex-shrink: 0;
    }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 66px; left: 50%; transform: translateX(-50%);
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 4px;
      padding: 7px 16px; font-size: 0.72rem; letter-spacing: 0.07em;
      color: var(--ok); z-index: 50;
      opacity: 0; transition: opacity 0.25s; pointer-events: none;
    }
    #toast.visible { opacity: 1; }

    /* ── Config editor overlay ── */
    #editor-overlay {
      display: none; position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      z-index: 100; background: rgba(5, 8, 18, 0.90);
      align-items: center; justify-content: center;
    }
    #editor-panel {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 7px; width: min(680px, 95vw);
      max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
    }
    #editor-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    #editor-header h2 { font-size: 0.72rem; letter-spacing: 0.14em; color: var(--accent); text-transform: uppercase; }
    #editor-header .hint { font-size: 0.67rem; color: var(--label); letter-spacing: 0.05em; }
    #editor-close { background: none; border: none; color: var(--label); font-size: 17px; cursor: pointer; padding: 0 4px; }
    #editor-close:hover { color: var(--text); }
    #config-textarea {
      flex: 1; background: var(--bg); color: var(--text); border: none; outline: none;
      font-family: 'Courier New', monospace; font-size: 12px; line-height: 1.6;
      padding: 14px 16px; resize: none; min-height: 360px;
    }
    #editor-footer {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; border-top: 1px solid var(--border); flex-shrink: 0;
    }
    #editor-status { flex: 1; font-size: 0.72rem; color: var(--label); letter-spacing: 0.06em; }
    .btn-save {
      background: #142238; border: 1px solid #1e3354; border-radius: 3px;
      color: var(--accent); padding: 7px 16px; font-size: 0.72rem; font-family: inherit;
      font-weight: bold; cursor: pointer; letter-spacing: 0.1em;
      text-transform: uppercase; transition: background 0.15s;
    }
    .btn-save:hover { background: #1a2e4a; }
    .btn-cancel {
      background: none; border: 1px solid var(--border); border-radius: 3px;
      color: var(--label); padding: 7px 13px; font-size: 0.72rem;
      font-family: inherit; cursor: pointer; letter-spacing: 0.1em; text-transform: uppercase;
    }
    .btn-cancel:hover { color: var(--text); border-color: var(--label); }
  </style>
</head>
<body>

  <!-- ── Top bar ── -->
  <header class="topbar">
    <span class="brand">WebHMI</span>
    <span class="page-title" id="hmi-title">Loading...</span>
    <div class="topbar-right">
      <button class="btn-edit-top" onclick="openEditor()">&#9881; Edit Config</button>
      <a class="btn-edit-top"    href="/settings">&#9965; Settings</a>
      <a class="btn-logout-top"  href="/logout">&#8594; Logout</a>
      <span id="clock">00:00:00</span>
      <div class="online-badge"><span class="dot"></span>ONLINE</div>
    </div>
  </header>

  <!-- ── Widget grid ── -->
  <main id="grid"></main>

  <!-- ── Alarms bar ── -->
  <div id="alarms-bar">
    <span class="alarms-label">ALARMS <span class="alarm-dot">&#x2022;</span></span>
    <span id="alarms-text">No active alarms</span>
  </div>

  <!-- ── Footer ── -->
  <footer>WebHMI &mdash; Config stored in SPIFFS/config.json</footer>

  <!-- ── Toast ── -->
  <div id="toast"></div>

  <!-- ── Config editor overlay ── -->
  <div id="editor-overlay">
    <div id="editor-panel">
      <div id="editor-header">
        <h2>Edit config.json</h2>
        <span class="hint">Saved directly to device SPIFFS &mdash; no recompile needed</span>
        <button id="editor-close" onclick="closeEditor()">&#x2715;</button>
      </div>
      <textarea id="config-textarea" spellcheck="false"></textarea>
      <div id="editor-footer">
        <span id="editor-status"></span>
        <button class="btn-cancel" onclick="closeEditor()">Cancel</button>
        <button class="btn-save"   onclick="saveConfig()">Save &amp; Reload</button>
      </div>
    </div>
  </div>

  <script src="hmi.js"></script>
</body>
</html>
